# 📍 /infrastructure/nginx/property-marketplace.conf
#
# Nginx site config for Property Marketplace.
# Place at: /etc/nginx/sites-available/property-marketplace
# Symlink:  /etc/nginx/sites-enabled/property-marketplace
#
# After first deploy, run:
#   certbot --nginx -d example.com -d www.example.com

# ─── Upstreams ────────────────────────────────────────────────
upstream property_web {
    server 127.0.0.1:3035;
    keepalive 32;
}

upstream property_api {
    server 127.0.0.1:4035;
    keepalive 32;
}

# ─── HTTP → HTTPS redirect ────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # ACME challenge for Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS main site ──────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    # ─── SSL (managed by Certbot) ─────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ─── Security headers ────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ─── Request limits ──────────────────────────────────────
    client_max_body_size 25m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # ─── Compression ─────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ─── Logging ─────────────────────────────────────────────
    access_log /var/log/nginx/property-access.log;
    error_log  /var/log/nginx/property-error.log;

    # ─── ACME challenge ──────────────────────────────────────
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ─── API — proxy to NestJS ───────────────────────────────
    location /api/ {
        proxy_pass http://property_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # WebSocket upgrade
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
    }

    # ─── Socket.IO — proxy to NestJS WebSocket ───────────────
    location /socket.io/ {
        proxy_pass http://property_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 7d;
        proxy_send_timeout    7d;
        proxy_read_timeout    7d;

        proxy_buffering off;
    }

    # ─── Health check — direct pass-through ──────────────────
    location = /health {
        proxy_pass http://property_api/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ─── Next.js static assets — long cache ──────────────────
    location /_next/static/ {
        proxy_pass http://property_web;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /_next/image {
        proxy_pass http://property_web;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=3600";
    }

    # ─── Favicon / robots / sitemap ──────────────────────────
    location ~ ^/(favicon\.ico|robots\.txt|sitemap\.xml)$ {
        proxy_pass http://property_web;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=3600";
    }

    # ─── Everything else — Next.js ───────────────────────────
    location / {
        proxy_pass http://property_web;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 32 8k;
    }
}