# 📍 /infrastructure/docker/redis/redis.conf
#
# Local Development Redis config.
# Production-এ password + TLS লাগবে — Phase 10-এ handle হবে।

# ─── Network ────────────────────────────────────────────────
bind 0.0.0.0
port 6379
protected-mode no

# ─── Memory ─────────────────────────────────────────────────
# 256MB max — plenty for local dev.
# `noeviction` কারণ BullMQ jobs হারানো যাবে না।
maxmemory 256mb
maxmemory-policy noeviction

# ─── Persistence ────────────────────────────────────────────
# AOF ensures jobs survive container restart
appendonly yes
appendfsync everysec

# RDB snapshot for faster loading
save 900 1
save 300 10
save 60 10000

# ─── Slow Log ───────────────────────────────────────────────
# Log queries taking > 10ms (helpful for debugging BullMQ)
slowlog-log-slower-than 10000
slowlog-max-len 128

# ─── Keyspace Notifications ─────────────────────────────────
# Not required now, but useful later if we add Socket.IO scale-out
# notify-keyspace-events Ex

# ─── Logging ────────────────────────────────────────────────
loglevel notice